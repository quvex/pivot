# Render blueprint (free plan): one web service. The free plan sleeps after 15 minutes idle and
# has 0.1 CPU, so the Hugging Face Space (deploy/huggingface) is the better free home.
services:
  - type: web
    name: pivot
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: PIVOT_REFRESH_HOUR
        value: "6"
