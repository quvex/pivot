name: Space

# Redeploys the Hugging Face Space on every push to main. Needs a repository secret HF_TOKEN (a
# Hugging Face token with write access) and a repository variable HF_SPACE ("user/space-name").
# Without them this does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then echo "HF_TOKEN or HF_SPACE not set: skipping"; exit 0; fi
          user="${HF_SPACE%%/*}"
          git clone "https://${user}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          cp deploy/huggingface/README.md space/README.md
          sed "s/^ARG COMMIT=main$/ARG COMMIT=${GITHUB_SHA}/" deploy/huggingface/Dockerfile > space/Dockerfile
          cd space
          git config user.name "pivot-deploy"
          git config user.email "pivot-deploy@users.noreply.github.com"
          git add README.md Dockerfile
          git commit -m "Deploy ${GITHUB_SHA::7}" || { echo "No change"; exit 0; }
          git push
